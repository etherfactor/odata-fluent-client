trigger: none

variables:
  - group: dependency-track

resources:
  repositories:
  - repository: sharedTemplates
    type: git
    name: 'Projects/PipelineTemplates'
    ref: 'refs/heads/feature/vuln-test'

stages:

- stage: audit
  displayName: 'Audit'
  
  jobs:
  
  # Audit vulnerabilities and publish them
  - template: node/security/vulnerability.yml@sharedTemplates
    parameters:
      name: 'audit'
      vmImage: 'ubuntu-22.04'
      nodeVersion: '22.x.x'
      pathToProject: '$(Build.SourcesDirectory)'
      dtrackApiUrl: '$(DependencyTrack.ApiUrl)'
      dtrackApiKey: '$(DependencyTrack.ApiKey)'
      dtrackProjectId: 'f2bb8206-e831-46f3-a9f9-c138c62a61a8'
